apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
      enabled: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    namespace: argo-rollouts
    name: in-cluster
  source:
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: "2.43.12"
    chart: argo-rollouts
    helm:
      values: |
        controller:
          replicas: 1
          trafficRouterPlugins:
            - name: "argoproj-labs/gatewayAPI"
              location: "https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.17.0/gatewayapi-plugin-linux-arm64"
        dashboard:
          enabled: true
          httproute:
            enabled: true
            hostnames:
              - argorollouts.example.com
              - argorollouts
            parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: eg
              namespace: envoy-gateway-system
