apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-test
  namespace: test-rollout
spec:
  metrics:
  - name: success-rate
    interval: 5m
    # NOTE: prometheus queries return results in the form of a vector.
    # So it is common to access the index 0 of the returned array to obtain the value
    successCondition: result[0] >= 0.95
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus-server.monitoring.svc.cluster.local
        # timeout is expressed in seconds
        timeout: 40
        query: |
          sum(irate(
            envoy_cluster_external_upstream_rq{envoy_cluster_name="httproute/test-rollout/argo-rollouts-http-route/rule/0",envoy_response_code="200"}[5m]
          )) /
          sum(irate(
            envoy_cluster_external_upstream_rq{envoy_cluster_name="httproute/test-rollout/argo-rollouts-http-route/rule/0"}[5m]
          ))
